name: Bot Automation Pancake 24/7

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest 
    timeout-minutes: 10

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v3

      - name: 2. Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Cài đặt thư viện & Playwright
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: 4. Tạo file credentials (Google Sheet) từ GitHub Secrets
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDS" > credentials.json

      - name: 5. Tạo file pancake_state.json từ GitHub Secrets (giữ session đăng nhập Pancake)
        env:
          PANCAKE_STATE: ${{ secrets.PANCAKE_STATE }}
        run: echo "$PANCAKE_STATE" > pancake_state.json

      - name: 6. Chạy Bot
        run: python bot.py

      - name: 7. Upload ảnh lỗi (nếu có)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
